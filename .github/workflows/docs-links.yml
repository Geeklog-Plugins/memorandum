name: Memorandum documentation links

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/check_docs.py'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'tools/check_docs.py'
      - '.github/workflows/docs-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify local Markdown paths and anchors
        run: python3 tools/check_docs.py
